<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Classifier AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-primary: #2dd4bf;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(45, 212, 191, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-dim);
            text-align: center;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.1);
        }

        .btn-classify {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn-classify:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(45, 212, 191, 0.4);
        }

        .btn-classify:active {
            transform: translateY(0);
        }

        .result-card {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            display: none;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .confidence-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            width: 0%;
            transition: width 1s ease-in-out;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resume Classifier AI</h1>
        <p class="subtitle">Experience the power of LSTM-based resume categorization</p>
        
        <div class="input-group">
            <textarea id="resumeInput" placeholder="Paste resume text here..."></textarea>
        </div>
        
        <button class="btn-classify" onclick="classifyResume()">Classify Resume</button>
        <div id="loader" class="loader"></div>

        <div id="resultCard" class="result-card">
            <div class="result-label">Predicted Category</div>
            <div id="categoryValue" class="result-value">---</div>
            
            <div class="confidence-bar">
                <div id="confidenceFill" class="confidence-fill"></div>
            </div>
            
            <div class="result-label">Confidence Score</div>
            <div id="confidenceValue" class="result-value" style="font-size: 1.2rem; color: var(--accent-secondary);">0%</div>
        </div>
    </div>

    <script>
        async function classifyResume() {
            const resumeInput = document.getElementById('resumeInput').value;
            const resultCard = document.getElementById('resultCard');
            const categoryValue = document.getElementById('categoryValue');
            const confidenceValue = document.getElementById('confidenceValue');
            const confidenceFill = document.getElementById('confidenceFill');
            const loader = document.getElementById('loader');

            if (!resumeInput.trim()) {
                alert("Please paste some resume text first!");
                return;
            }

            // UI State
            resultCard.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resume: resumeInput })
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error);
                } else {
                    categoryValue.innerText = data.category;
                    confidenceValue.innerText = data.confidence + '%';
                    confidenceFill.style.width = data.confidence + '%';
                    
                    loader.style.display = 'none';
                    resultCard.style.display = 'block';
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred during classification.");
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
